name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # The app reaches a separate REST API - through proxy.conf.json in dev,
      # through the hosted URL in src/app/config.ts otherwise. Pages serves
      # static files only, so without a stand-in every screen stops at login.
      # This interceptor answers those same calls from the browser and keeps
      # its data in localStorage, so the demo behaves like the real thing.
      # See demo/README.md.
      - name: Add the browser-side demo backend
        run: |
          cp demo/demo-backend.interceptor.ts src/app/demo-backend.interceptor.ts
          grep -q "demoBackendInterceptor" src/app/demo-backend.interceptor.ts

      # Registering it means touching the HttpClient provider chain, so this
      # config is a copy of the original with the demo interceptor appended -
      # every other provider stays exactly as she wrote it.
      - name: Register it in the app config
        run: |
          cp demo/app.config.demo.ts src/app/app.config.ts
          grep -q "demoBackendInterceptor" src/app/app.config.ts

      - name: Build
        run: npx ng build --base-href=/Task-manager/

      - name: Locate build output
        id: out
        run: |
          for d in dist/task-manager/browser dist/task-manager dist/browser; do
            if [ -f "$d/index.html" ]; then echo "dir=$d" >> "$GITHUB_OUTPUT"; break; fi
          done
          test -n "$(grep '^dir=' "$GITHUB_OUTPUT" || true)" || { echo "no build output"; ls -R dist; exit 1; }

      # Angular's router uses the HTML5 history API, so a deep link like
      # /Task-manager/teams is a real URL to Pages, which has no such file.
      # Serving index.html as 404.html hands those URLs back to the router.
      - name: Prepare for Pages
        run: |
          d="${{ steps.out.outputs.dir }}"
          touch "$d/.nojekyll"
          cp "$d/index.html" "$d/404.html"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
